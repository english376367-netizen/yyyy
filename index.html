<script>
const sections = [
{id:"pron",title:"Pronunciation",intro:"Choose the word with a different primary-stress position.",questions:[
["Which word has a different stress pattern?",["singer","receive","programme","lyrics"],1,"“Receive” có trọng âm ở âm tiết thứ hai; các từ còn lại nhấn âm tiết đầu.","Từ nào có vị trí trọng âm khác với các từ còn lại?"],
["Which word has a different stress pattern?",["common","music","people","perform"],3,"“Perform” nhấn âm tiết thứ hai; common, music, people nhấn âm tiết đầu.","Từ nào có vị trí trọng âm khác với các từ còn lại?"],
["Which word has a different stress pattern?",["compose","careful","second","album"],0,"“Compose” là động từ có trọng âm ở âm tiết thứ hai; các từ còn lại nhấn âm tiết đầu.","Từ nào có vị trí trọng âm khác với các từ còn lại?"],
["Which word has a different stress pattern?",["talent","artist","award","famous"],2,"“Award” nhấn âm tiết thứ hai; talent, artist, famous nhấn âm tiết đầu.","Từ nào có vị trí trọng âm khác với các từ còn lại?"],
["Which word has a different stress pattern?",["upload","theatre","received","guitar"],1,"“Theatre” nhấn âm tiết đầu; upload, received, guitar nhấn âm tiết thứ hai. (Câu theo đáp án nguồn.)","Từ nào có vị trí trọng âm khác với các từ còn lại?"],
["Which word has a different stress pattern?",["weather","birthday","boring","expect"],3,"“Expect” nhấn âm tiết thứ hai; các từ còn lại nhấn âm tiết đầu.","Từ nào có vị trí trọng âm khác với các từ còn lại?"],
["Which word has a different stress pattern?",["become","idol","comment","season"],0,"“Become” nhấn âm tiết thứ hai; idol, comment, season nhấn âm tiết đầu.","Từ nào có vị trí trọng âm khác với các từ còn lại?"],
["Which word has a different stress pattern?",["theatre","movie","famous","attend"],3,"“Attend” nhấn âm tiết thứ hai; các từ còn lại nhấn âm tiết đầu.","Từ nào có vị trí trọng âm khác với các từ còn lại?"]
]},
{id:"vocab1",title:"Vocabulary · Exercise 1",intro:"Choose the odd one out.",questions:[
["A. band · B. musician · C. singer · D. movie",["band","musician","singer","movie"],3,"“Movie” thuộc lĩnh vực phim ảnh; các từ còn lại liên quan đến âm nhạc.","Band: ban nhạc; musician: nhạc sĩ/nhạc công; singer: ca sĩ; movie: phim."],
["A. violin · B. piano · C. song · D. flute",["violin","piano","song","flute"],2,"Song là bài hát; violin, piano và flute là nhạc cụ.","Đàn violin, đàn piano, bài hát, sáo."],
["A. pop · B. album · C. jazz · D. rock",["pop","album","jazz","rock"],1,"Album không phải thể loại nhạc; pop, jazz và rock là các thể loại nhạc.","Pop, album, jazz, rock."],
["A. hit · B. stage · C. theatre · D. cinema",["hit","stage","theatre","cinema"],0,"Theo đáp án nguồn, “hit” không cùng nhóm với các địa điểm/không gian biểu diễn.","Hit: bản nhạc thành công; stage: sân khấu; theatre: nhà hát; cinema: rạp chiếu phim."],
["A. judge · B. participant · C. show · D. movie",["judge","participant","show","movie"],3,"Movie là phim; các từ còn lại gắn với một chương trình/cuộc thi.","Judge: giám khảo; participant: người tham gia; show: chương trình; movie: phim."],
["A. perform · B. sing · C. award · D. practise",["perform","sing","award","practise"],2,"Award ở đây là động từ “trao thưởng”; các từ còn lại chỉ hoạt động biểu diễn/luyện tập.","Perform: biểu diễn; sing: hát; award: trao thưởng; practise: luyện tập."],
["A. famous · B. record · C. popular · D. favourite",["famous","record","popular","favourite"],1,"“Record” khi là động từ có trọng âm khác; các từ còn lại là tính từ/danh từ thường nhấn âm đầu.","Famous: nổi tiếng; record: ghi âm/ghi lại; popular: phổ biến; favourite: yêu thích."],
["A. audience · B. fan · C. idol · D. student",["audience","fan","idol","student"],3,"Student không thuộc nhóm từ chỉ khán giả/người hâm mộ/thần tượng trong lĩnh vực âm nhạc.","Audience: khán giả; fan: người hâm mộ; idol: thần tượng; student: học sinh."]
]},
{id:"vocab2",title:"Vocabulary · Exercise 2",intro:"Choose the correct form of the word in brackets.",questions:[
["There are many (talent) ______ participants in this show.",["talent","talented","talents","talenting"],1,"Cần tính từ bổ nghĩa cho “participants”: talented (tài năng).","Có nhiều người tham gia tài năng trong chương trình này."],
["We are really looking forward to her (perform) ______ this Sunday.",["perform","performance","performing","performed"],1,"Sau “look forward to” dùng danh từ hoặc V-ing; ở đây cần danh từ “performance”.","Chúng tôi thực sự mong chờ màn trình diễn của cô ấy vào Chủ nhật này."],
["She dreams of becoming a famous rock (sing) ______.",["sing","singer","singing","sang"],1,"Cần danh từ chỉ người: singer (ca sĩ).","Cô ấy mơ ước trở thành một ca sĩ nhạc rock nổi tiếng."],
["The piano is a great (music) ______ instrument for beginners.",["music","musically","musical","musician"],2,"Cần tính từ trước danh từ “instrument”: musical instrument (nhạc cụ).","Đàn piano là một nhạc cụ tuyệt vời cho người mới bắt đầu."],
["I love reading books about famous (art) ______.",["arts","artist","artists","artistic"],2,"Sau “famous” và nói về nhiều người, dùng danh từ số nhiều “artists”.","Tôi thích đọc sách về những nghệ sĩ nổi tiếng."],
["My friend and I were so (excite) ______ to go to the Youth Music Festival.",["exciting","excited","excite","excitement"],1,"Người cảm thấy hào hứng dùng tính từ đuôi -ed: excited.","Tôi và bạn tôi rất hào hứng khi được đến Lễ hội Âm nhạc Thanh niên."],
["She decided to make an audio (record) ______ for her first song.",["record","recording","recorded","recorder"],1,"“Audio recording” nghĩa là bản thu âm.","Cô ấy quyết định tạo một bản thu âm cho bài hát đầu tiên của mình."],
["The (win) ______ of the competition will receive a big prize.",["winning","winner","won","wins"],1,"Cần danh từ chỉ người chiến thắng: winner.","Người chiến thắng cuộc thi sẽ nhận được một giải thưởng lớn."]
]},
{id:"grammar1",title:"Grammar · Exercise 1",intro:"Circle the correct verb form.",questions:[
["Mai agreed ______ my old laptop.",["buy","to buy"],1,"“Agree + to V” = đồng ý làm gì.","Mai đồng ý mua chiếc máy tính xách tay cũ của tôi."],
["His teacher made him ______ for his bad behaviour.",["apologise","to apologise"],0,"“Make + object + V nguyên mẫu không to”.","Giáo viên bắt anh ấy xin lỗi vì hành vi không tốt của mình."],
["They decided ______ to the live concert.",["going","to go"],1,"“Decide + to V” = quyết định làm gì.","Họ quyết định đi xem buổi hòa nhạc trực tiếp."],
["I'd love ______ Paris one day.",["to visit","visit"],0,"“Would love + to V” = rất muốn làm gì.","Tôi rất muốn đến thăm Paris vào một ngày nào đó."],
["His parents didn't let him ______ to music school.",["go","to go"],0,"“Let + object + V nguyên mẫu không to”.","Bố mẹ không cho anh ấy đi học nhạc."],
["We managed ______ their first album on social media.",["find","to find"],1,"“Manage + to V” = xoay xở/cố gắng làm được việc gì.","Chúng tôi đã tìm được album đầu tiên của họ trên mạng xã hội."],
["I saw her ______ the street.",["cross","to cross"],0,"Sau động từ tri giác “see + object”, có thể dùng V nguyên mẫu để nói thấy toàn bộ hành động.","Tôi đã nhìn thấy cô ấy băng qua đường."],
["I heard him ______ the window last night.",["open","to open"],0,"“Hear + object + V nguyên mẫu” khi nghe thấy toàn bộ hành động.","Tối qua tôi nghe thấy anh ấy mở cửa sổ."],
["Dad promised ______ us to the circus on Sunday.",["take","to take"],1,"“Promise + to V” = hứa làm gì.","Bố hứa đưa chúng tôi đi xem xiếc vào Chủ nhật."],
["He really wants ______ to play a musical instrument this summer.",["learn","to learn"],1,"“Want + to V” = muốn làm gì.","Mùa hè này, cậu ấy thực sự muốn học chơi một nhạc cụ."]
]},
{id:"grammar2",title:"Grammar · Exercise 2",intro:"Choose the correct compound sentence.",questions:[
["I'd like to go to the party. I'm too busy. (but)",["I'd like to go to the party, but I'm too busy.","I'd like to go to the party, so I'm too busy.","I'd like to go to the party, or I'm too busy."],0,"“But” nối hai ý tương phản.","Tôi muốn đi dự tiệc, nhưng tôi quá bận."],
["It was sunny. Lan took an umbrella. (so)",["It was sunny, but Lan took an umbrella.","It was sunny, so Lan took an umbrella.","It was sunny, or Lan took an umbrella."],1,"“So” diễn tả kết quả: vì vậy.","Trời nắng nên Lan mang theo ô."],
["Anna is an amazing dancer. Her parents are proud of her. (and)",["Anna is an amazing dancer, and her parents are proud of her.","Anna is an amazing dancer, but her parents are proud of her.","Anna is an amazing dancer, or her parents are proud of her."],0,"“And” nối hai thông tin bổ sung.","Anna là một vũ công tuyệt vời và bố mẹ cô ấy tự hào về cô ấy."],
["You can vote online for your favourite singer. You can send text messages. (or)",["You can vote online for your favourite singer, but you can send text messages.","You can vote online for your favourite singer, so you can send text messages.","You can vote online for your favourite singer, or you can send text messages."],2,"“Or” đưa ra lựa chọn.","Bạn có thể bình chọn trực tuyến cho ca sĩ yêu thích hoặc gửi tin nhắn."],
["Lisa went shopping yesterday. She didn't buy anything. (but)",["Lisa went shopping yesterday, but she didn't buy anything.","Lisa went shopping yesterday, so she didn't buy anything.","Lisa went shopping yesterday, and she didn't buy anything."],0,"“But” diễn tả sự tương phản giữa đi mua sắm và không mua gì.","Hôm qua Lisa đi mua sắm nhưng cô ấy không mua gì cả."],
["John's parents own a restaurant. Sometimes he helps in the kitchen at weekends. (and)",["John's parents own a restaurant, or sometimes he helps in the kitchen at weekends.","John's parents own a restaurant, and sometimes he helps in the kitchen at weekends.","John's parents own a restaurant, but sometimes he helps in the kitchen at weekends."],1,"“And” nối hai sự việc có liên quan.","Bố mẹ John sở hữu một nhà hàng và đôi khi cậu ấy phụ giúp trong bếp vào cuối tuần."],
["Go inside. You will catch a cold. (or)",["Go inside, and you will catch a cold.","Go inside, but you will catch a cold.","Go inside, or you will catch a cold."],2,"“Or” trong câu mệnh lệnh có thể mang nghĩa “nếu không thì”.","Vào trong đi, nếu không bạn sẽ bị cảm lạnh."],
["Rita is a good drummer. She will probably be invited to join the band. (so)",["Rita is a good drummer, so she will probably be invited to join the band.","Rita is a good drummer, but she will probably be invited to join the band.","Rita is a good drummer, or she will probably be invited to join the band."],0,"“So” nối nguyên nhân và kết quả.","Rita là một tay trống giỏi, vì vậy có lẽ cô ấy sẽ được mời tham gia ban nhạc."]
]},
{id:"grammar3",title:"Grammar · Exercise 3",intro:"Complete each sentence with the correct verb form.",questions:[
["We plan (perform) ______ in Europe this summer.",["perform","to perform","performing"],1,"“Plan + to V” = dự định làm gì.","Chúng tôi dự định biểu diễn ở châu Âu vào mùa hè này."],
["Finn should manage (go) ______ to bed earlier.",["go","going","to go"],2,"“Manage + to V” = xoay xở làm được việc gì.","Finn nên cố gắng đi ngủ sớm hơn."],
["The teacher warned him (not be) ______ late for class again.",["not to be","to not being","not be"],0,"“Warn + object + not to V” = cảnh báo ai không được làm gì.","Giáo viên cảnh cáo cậu ấy không được đi học muộn nữa."],
["Don't let her (eat) ______ too much.",["to eat","eat","eating"],1,"“Let + object + V nguyên mẫu không to”.","Đừng để cô ấy ăn quá nhiều."],
["I forgot (lock) ______ the door when I left home this morning.",["locking","to lock","lock"],1,"“Forget + to V” = quên phải làm việc gì.","Sáng nay tôi đã quên khóa cửa khi rời khỏi nhà."],
["The manager made the singer (practise) ______ so hard for the show.",["to practise","practising","practise"],2,"“Make + object + V nguyên mẫu không to”.","Người quản lý bắt ca sĩ luyện tập rất chăm chỉ cho buổi biểu diễn."]
]},
{id:"reading1",title:"Reading · Exercise 1",intro:"Read the passage on the left and answer each question on the right.",passage:"Gilberto Gil is a Brazilian singer and guitarist, and one of his country's most (1) ______ songwriters. As a young (2) ______ in the 1950s, he was influenced by the style of Joao Gilberto, but he didn't release his first album, Louvacao, (3) ______ 1967. He travelled in the 1970s, recorded an album in English (4) ______ in 1980, introduced reggae to Brazil when he released his version of Bob Marley's song, 'No woman, no cry.’ He has played (5) ______ many musicians, while continuing his career as a solo artist. In all he has produced over 40 albums. His music appeals to people because of its rhythms and (6) ______ but people also admire him for his work in politics and for social causes.",translation:"Gilberto Gil là một ca sĩ và nghệ sĩ guitar người Brazil, đồng thời là một trong những nhạc sĩ tài năng nhất của đất nước mình. Khi còn là một nhạc sĩ trẻ vào những năm 1950, ông chịu ảnh hưởng từ phong cách của João Gilberto, nhưng mãi đến năm 1967 ông mới phát hành album đầu tiên, Louvação. Ông đi du lịch trong những năm 1970, thu âm một album bằng tiếng Anh và vào năm 1980 giới thiệu reggae đến Brazil khi phát hành phiên bản bài hát “No Woman, No Cry” của Bob Marley. Ông đã chơi nhạc cùng nhiều nhạc sĩ trong khi tiếp tục sự nghiệp solo. Tổng cộng ông đã phát hành hơn 40 album. Âm nhạc của ông thu hút mọi người nhờ nhịp điệu và giai điệu, nhưng mọi người cũng ngưỡng mộ ông vì hoạt động chính trị và các hoạt động xã hội.",questions:[
["Blank (1)",["talent","talenting","talented","talents"],2,"Sau “most” và trước danh từ “songwriters” cần tính từ “talented”.","Gilberto Gil là một trong những nhạc sĩ tài năng nhất của đất nước mình."],
["Blank (2)",["music","musical","musically","musician"],3,"“A young musician” nghĩa là một nhạc sĩ trẻ.","Khi còn là một nhạc sĩ trẻ vào những năm 1950..."],
["Blank (3)",["before","until","after","in"],1,"Cấu trúc “not ... until” = mãi đến ... mới.","Ông mãi đến năm 1967 mới phát hành album đầu tiên."],
["Blank (4)",["but","so","and","or"],2,"“And” nối hai hành động/sự kiện trong câu.","Ông thu âm một album bằng tiếng Anh và vào năm 1980 giới thiệu reggae đến Brazil."],
["Blank (5)",["for","with","by","to"],1,"“Play with musicians” = chơi nhạc cùng các nhạc sĩ.","Ông đã chơi nhạc cùng nhiều nhạc sĩ."],
["Blank (6)",["melodies","songs","music","sound"],0,"“Rhythms and melodies” là cụm kết hợp tự nhiên: nhịp điệu và giai điệu.","Âm nhạc của ông thu hút mọi người nhờ nhịp điệu và giai điệu."]
]},
{id:"reading2",title:"Reading · Exercise 2A",intro:"Read the passage on the left and choose True or False on the right.",passage:"Nowadays, teenagers like to watch music videos online. This is now more popular than listening to the radio. Some videos can quickly become extremely popular internationally and reach one billion views. Some music hits get more than 10 million views in less than 20 minutes.\n\nDownloading music is a popular choice for youngsters. People in many countries prefer downloading singles rather than albums. This only costs a small amount of money. Using file-sharing websites to download music is often illegal but some people still continue to get their music this way. Record companies and many musicians are very unhappy that people can listen to their music without paying for it.\n\nWhat are you and your friends listening to these days? Hip hop dance, rock, heavy metal, rap? Music tastes are very varied amongst teenagers around the world. A shopping centre in the UK recently discovered what kind of music some local teenagers don't like. This is what happened: shoppers and shop owners complained to the police about teenagers behaving badly there. When a new sound system started playing Bach, Mozart and Beethoven, the antisocial behaviour stopped.",translation:"Ngày nay, thanh thiếu niên thích xem video âm nhạc trực tuyến. Việc này hiện phổ biến hơn nghe đài. Một số video nhanh chóng nổi tiếng trên toàn thế giới và đạt một tỷ lượt xem. Một số bản hit có hơn 10 triệu lượt xem trong chưa đầy 20 phút.\n\nTải nhạc là lựa chọn phổ biến của giới trẻ. Ở nhiều quốc gia, mọi người thích tải từng bài hát hơn là cả album. Việc này chỉ tốn một khoản tiền nhỏ. Sử dụng các trang chia sẻ tệp để tải nhạc thường là bất hợp pháp, nhưng một số người vẫn tiếp tục nghe nhạc theo cách đó. Các công ty thu âm và nhiều nhạc sĩ rất không hài lòng khi mọi người nghe nhạc của họ mà không trả tiền.\n\nGần đây bạn và bạn bè đang nghe thể loại nhạc nào? Hip hop, rock, heavy metal hay rap? Khẩu vị âm nhạc của thanh thiếu niên trên khắp thế giới rất đa dạng. Một trung tâm mua sắm ở Anh gần đây phát hiện loại nhạc mà một số thanh thiếu niên địa phương không thích. Người mua sắm và chủ cửa hàng đã phàn nàn với cảnh sát về hành vi không đúng mực của các bạn trẻ. Khi hệ thống âm thanh mới phát nhạc của Bach, Mozart và Beethoven, hành vi chống đối xã hội đã chấm dứt.",questions:[
["Watching music videos online is now more popular than listening to the radio.",["True","False"],0,"Câu đầu đoạn văn nói rõ xem video âm nhạc trực tuyến phổ biến hơn nghe radio.","Xem video âm nhạc trực tuyến hiện phổ biến hơn nghe đài. — Đúng."],
["Some music videos can reach one billion views.",["True","False"],0,"Bài đọc nói một số video có thể đạt một tỷ lượt xem.","Một số video âm nhạc có thể đạt một tỷ lượt xem. — Đúng."],
["Downloading individual songs is less popular than downloading albums.",["True","False"],1,"Bài đọc nói nhiều người thích tải từng bài hát hơn album.","Tải từng bài hát ít phổ biến hơn tải album. — Sai."],
["Downloading music from file-sharing websites is always legal.",["True","False"],1,"Bài đọc nói việc này thường bất hợp pháp.","Tải nhạc từ các trang chia sẻ tệp luôn hợp pháp. — Sai."],
["Playing classical music stopped the teenagers' antisocial behaviour in the shopping centre.",["True","False"],0,"Đoạn cuối nói hành vi không đúng mực dừng lại khi nhạc của Bach, Mozart và Beethoven được phát.","Phát nhạc cổ điển đã khiến hành vi chống đối xã hội của thanh thiếu niên trong trung tâm mua sắm chấm dứt. — Đúng."]
]},
{id:"reading2b",title:"Reading · Exercise 2B",intro:"Read the same passage and answer the questions.",passage:"Nowadays, teenagers like to watch music videos online. This is now more popular than listening to the radio. Some videos can quickly become extremely popular internationally and reach one billion views. Some music hits get more than 10 million views in less than 20 minutes.\n\nDownloading music is a popular choice for youngsters. People in many countries prefer downloading singles rather than albums. This only costs a small amount of money. Using file-sharing websites to download music is often illegal but some people still continue to get their music this way. Record companies and many musicians are very unhappy that people can listen to their music without paying for it.\n\nWhat are you and your friends listening to these days? Hip hop dance, rock, heavy metal, rap? Music tastes are very varied amongst teenagers around the world. A shopping centre in the UK recently discovered what kind of music some local teenagers don't like. This is what happened: shoppers and shop owners complained to the police about teenagers behaving badly there. When a new sound system started playing Bach, Mozart and Beethoven, the antisocial behaviour stopped.",translation:"Ngày nay, thanh thiếu niên thích xem video âm nhạc trực tuyến, việc này phổ biến hơn nghe đài. Một số video đạt một tỷ lượt xem và một số bản hit có hơn 10 triệu lượt xem trong chưa đầy 20 phút. Tải từng bài hát là lựa chọn phổ biến và chỉ tốn ít tiền. Việc tải nhạc từ các trang chia sẻ tệp thường bất hợp pháp. Khẩu vị âm nhạc của thanh thiếu niên rất đa dạng. Tại một trung tâm mua sắm ở Anh, hành vi không đúng mực của thanh thiếu niên chấm dứt khi hệ thống âm thanh phát nhạc cổ điển của Bach, Mozart và Beethoven.",questions:[
["What do teenagers like to watch online?",["Music videos","News reports","Sports lessons","Films only"],0,"Câu mở đầu nêu rõ thanh thiếu niên thích xem music videos online.","Thanh thiếu niên thích xem gì trên mạng? — Video âm nhạc."],
["What do people in many countries prefer downloading?",["Full albums only","Singles rather than albums","Classical music only","Free films"],1,"Đoạn hai nói mọi người thích tải từng bài hát hơn album.","Người ở nhiều quốc gia thích tải gì? — Từng bài hát thay vì album."],
["Why are record companies unhappy?",["People listen without paying","Songs are too short","Teenagers dislike pop","Radio is too popular"],0,"Bài đọc nói họ không vui vì mọi người nghe nhạc mà không trả tiền.","Tại sao các công ty thu âm không hài lòng? — Vì mọi người nghe nhạc mà không trả tiền."],
["What happened when classical music was played at the shopping centre?",["The teenagers danced more","The antisocial behaviour stopped","The police left immediately","The centre closed"],1,"Đoạn cuối nói hành vi chống đối xã hội chấm dứt khi nhạc cổ điển được phát.","Điều gì xảy ra khi nhạc cổ điển được phát ở trung tâm mua sắm? — Hành vi không đúng mực chấm dứt."]
]},
{id:"speaking1",title:"Speaking · Exercise 1",intro:"Choose the best answer to complete each conversation.",questions:[
["Phong: Let's go to the school concert on Saturday evening, Nam! Nam: ______. Where can we meet?",["I'd love to","I don't feel like it","I'm sorry","What about you?"],0,"“I'd love to” là cách nhận lời thân thiện.","Phong: Tối thứ Bảy chúng mình đi xem buổi hòa nhạc của trường nhé, Nam! Nam: Mình rất muốn. Chúng ta gặp nhau ở đâu?"],
["Mai: What are you going to do this weekend, Lan? Lan: I haven't got any plans. ______ we do something together?",["Will","Would","Shall","Let's"],2,"Đề nghị cùng làm gì: “Shall we + V...?”","Mai: Cuối tuần này bạn định làm gì, Lan? Lan: Mình chưa có kế hoạch. Chúng ta cùng làm gì đó nhé?"],
["Peter: ______ we talk about the benefits of music in our next presentation? Mike: That's a good idea.",["Let's","What about","Why don't","How"],2,"Cấu trúc “Why don't we + V...?” dùng để đưa ra lời gợi ý.","Peter: Sao chúng ta không nói về lợi ích của âm nhạc trong bài thuyết trình tiếp theo? Mike: Ý hay đấy."],
["Mai: Why don't you come with me to China? Ann: ______, but I've already booked another holiday.",["That's not possible","I'd love to","Sorry. I can't","I don't feel like it"],1,"“I'd love to, but...” thể hiện muốn làm nhưng có lý do không thể.","Mai: Sao bạn không đi Trung Quốc cùng mình? Ann: Mình rất muốn, nhưng mình đã đặt một chuyến nghỉ khác rồi."],
["Nam: Do you have any suggestions for the theme of our music festival? Peter: ______ Gen Z Music?",["How about","Is it","Why isn't","Is that"],0,"“How about + danh từ/V-ing?” dùng để đề xuất.","Nam: Bạn có gợi ý chủ đề cho lễ hội âm nhạc không? Peter: Thế còn Gen Z Music thì sao?"]
]},
{id:"writing1",title:"Writing · Exercise 1 (Type the sentence)",intro:"Write the complete sentence. Click Hint if you need a grammar clue. Copying is disabled in this exercise.",type:"typing",questions:[
["Beethoven / born / 1770 / Bonn, Germany.","Beethoven was born in 1770 in Bonn, Germany.","Dùng bị động quá khứ: was born; giới từ “in” trước năm và thành phố.","Beethoven sinh năm 1770 tại Bonn, Đức."],
["He / start / learn piano / age of 4 / and / taught / his father.","He started to learn piano at the age of 4 and was taught by his father.","Quá khứ đơn “started”; “start to V”; bị động quá khứ “was taught by”.","Ông bắt đầu học piano năm 4 tuổi và được cha dạy."],
["When / he / 22 / he / move / Vienna / study / famous composer Haydn.","When he was 22, he moved to Vienna to study with the famous composer Haydn.","Mệnh đề thời gian quá khứ “When he was 22”; động từ quá khứ “moved”; mục đích “to study”.","Khi 22 tuổi, ông chuyển đến Vienna để học với nhà soạn nhạc nổi tiếng Haydn."],
["He / start / become / famous composer / when / he / 30.","He started to become a famous composer when he was 30.","Quá khứ đơn; cấu trúc “when he was 30”.","Ông bắt đầu trở thành nhà soạn nhạc nổi tiếng khi 30 tuổi."],
["He / write / many works / heroes and struggles.","He wrote many works about heroes and struggles.","Quá khứ đơn của write là wrote; “works about” nghĩa là tác phẩm về.","Ông đã viết nhiều tác phẩm về những anh hùng và các cuộc đấu tranh."],
["In / late 20s / he / start / lose hearing / and / become / quite ill / during / last years / life.","In his late 20s, he started to lose his hearing and became quite ill during the last years of his life.","Quá khứ đơn “started/became”; “lose his hearing” là mất thính lực.","Vào cuối những năm 20 tuổi, ông bắt đầu mất thính lực và trở nên khá ốm yếu trong những năm cuối đời."],
["He / die / age of 57 / Vienna.","He died at the age of 57 in Vienna.","Quá khứ của “die” là “died”; cụm “at the age of 57”.","Ông qua đời ở Vienna ở tuổi 57."],
["Beethoven / write / many symphonies / well-known piano sonatas / and / become / master musician / all time.","Beethoven wrote many symphonies and well-known piano sonatas and became a master musician of all time.","Dùng quá khứ đơn “wrote/became”; “symphonies and sonatas” nối bằng and.","Beethoven đã viết nhiều bản giao hưởng, các bản sonata piano nổi tiếng và trở thành một nhạc sĩ bậc thầy của mọi thời đại."]
]},
{id:"writing2",title:"Writing · Exercise 2",intro:"Choose the sentence closest in meaning to the original.",questions:[
["He started playing the guitar six years ago.",["He has played the guitar for six years.","It was six years ago did he start playing the guitar.","He hasn't played the guitar for six years.","It is six years since he has played the guitar."],0,"Quá khứ bắt đầu và vẫn tiếp tục đến hiện tại: “started ... six years ago” = “has played ... for six years”.","Anh ấy bắt đầu chơi guitar sáu năm trước. / Anh ấy đã chơi guitar được sáu năm."],
["They are not allowed to go out in the evening by their parents.",["Going out in the evening is permitted by their parents.","Their parents never go out in the evening.","Their parents do not let them go out in the evening.","Although their parents do not allow, they still go out."],2,"“Be not allowed to do” tương đương “not let somebody do”.","Các em không được bố mẹ cho phép ra ngoài vào buổi tối."],
["I'll let you borrow the book but you must promise to return it next week.",["If you promise to return the book next week, I'll let you borrow it.","If you promised to return the book next week, I let you borrow it.","If you promise to return it, I won't let you borrow it.","If you promised, I'll let you borrow it."],0,"Câu điều kiện loại 1: If + hiện tại đơn, will + V.","Tôi sẽ cho bạn mượn sách nhưng bạn phải hứa trả lại vào tuần tới."],
["They are building a new highway around the city.",["A new highway is being built around the city.","A new highway is been built around the city.","A new highway around the city was built.","A new highway builds around the city."],0,"Bị động hiện tại tiếp diễn: am/is/are + being + V3.","Họ đang xây một đường cao tốc mới quanh thành phố."],
["'Let's go to the theatre tonight,' she suggested.",["She suggested they to go to the theatre that night.","She suggested going to the theatre that night.","She suggested that they went to the theatre that night.","She suggested that let's them go that night."],1,"“Suggest + V-ing” dùng khi đề xuất làm gì.","Cô ấy đề nghị đi xem kịch tối hôm đó."],
["She prefers staying at home to going out.",["She likes staying at home more than going out.","Staying at home is her favourite.","She doesn't like staying at home as much as going out.","She would rather stay at home than going out."],0,"“Prefer A to B” gần nghĩa “like A more than B”.","Cô ấy thích ở nhà hơn là đi ra ngoài."],
["The band decided to delay their concert because the weather was bad.",["Despite the bad weather, the band delayed the concert.","The bad weather made the band delay their concert.","The band performed in bad weather.","The bad weather did not make them delay the concert."],1,"“Because the weather was bad” diễn tả nguyên nhân; “made ... delay” thể hiện thời tiết xấu khiến họ hoãn.","Ban nhạc quyết định hoãn buổi hòa nhạc vì thời tiết xấu."],
["Laura went shopping. She didn't buy anything.",["Laura went shopping, so she didn't buy anything.","Laura went shopping, or she didn't buy anything.","Laura went shopping, but she didn't buy anything.","Laura went shopping, then she didn't buy anything."],2,"“But” nối hai ý tương phản.","Laura đi mua sắm nhưng cô ấy không mua thứ gì."]
]},
{id:"looking",title:"Looking Back · Reading cloze",intro:"Read the passage on the left and choose the best answer for each blank on the right.",passage:"Music has a strong influence on the human mind, (1) ______ it is closely connected to memory and emotion. It can bring back memories that were hidden for many years. For example, when you hear a song that a(n) (2) ______ used to perform, it may remind you of a happy moment from the past. But music can also (3) ______ us of sad times, so it can bring back painful feelings.\n\nBecause of this power, therapists often use music to help people with Alzheimer’s disease. (4) ______ patients listen to songs they loved before, especially songs they heard (5) ______ or at a concert, they may suddenly remember the lyrics. As a result, some people who seemed to have lost their (6) ______ begin humming and singing again.\n\nMusic can also help reduce pain. It is not medicine that we swallow, (7) ______ it can still be effective. When music is played, our attention changes, so we focus less on the (8) ______. The pain may still be there, but the music becomes more important in our mind.\n\nToday, researchers also study how strongly music affects us. Some songs are so enjoyable that we want to (9) ______ them again and again. Studies show that emotional music can activate the brain’s reward system, so it gives us energy and pleasure. In this way, music can become (10) ______ but it is probably one of the healthiest addictions.",translation:"Âm nhạc có ảnh hưởng mạnh mẽ đến tâm trí con người và có mối liên hệ chặt chẽ với trí nhớ và cảm xúc. Nó có thể khơi lại những ký ức đã bị chôn giấu nhiều năm. Ví dụ, khi nghe một bài hát từng được một nghệ sĩ biểu diễn, bạn có thể nhớ lại khoảnh khắc vui vẻ trong quá khứ. Nhưng âm nhạc cũng có thể gợi nhắc những khoảng thời gian buồn và khơi lại cảm xúc đau đớn.\n\nVì sức mạnh này, các nhà trị liệu thường dùng âm nhạc để giúp người mắc bệnh Alzheimer. Khi bệnh nhân nghe những bài hát họ từng yêu thích, đặc biệt là những bài họ nghe trực tiếp hoặc tại buổi hòa nhạc, họ có thể đột nhiên nhớ lại lời bài hát. Vì thế, một số người tưởng như đã mất trí nhớ bắt đầu ngân nga và hát trở lại.\n\nÂm nhạc cũng có thể giúp giảm đau. Nó không phải thuốc để nuốt, nhưng vẫn có thể hiệu quả. Khi nhạc vang lên, sự chú ý của chúng ta thay đổi nên ta ít tập trung vào cơn đau hơn. Cơn đau có thể vẫn còn, nhưng âm nhạc trở nên quan trọng hơn trong tâm trí.\n\nNgày nay, các nhà nghiên cứu cũng tìm hiểu mức độ ảnh hưởng của âm nhạc. Một số bài hát thú vị đến mức chúng ta muốn nghe đi nghe lại. Các nghiên cứu cho thấy âm nhạc giàu cảm xúc có thể kích hoạt hệ thống tưởng thưởng của não, đem lại năng lượng và niềm vui. Theo cách này, âm nhạc có thể gây nghiện, nhưng có lẽ là một trong những dạng nghiện lành mạnh nhất.",questions:[
["Blank (1)",["but","so","and","or"],2,"Hai ý bổ sung cho nhau nên dùng “and”.","Âm nhạc có ảnh hưởng mạnh đến tâm trí và có liên hệ chặt chẽ với trí nhớ, cảm xúc."],
["Blank (2)",["artist","composer","producer","actor"],0,"Một nghệ sĩ biểu diễn bài hát: “an artist used to perform”.","Khi nghe bài hát mà một nghệ sĩ từng biểu diễn..."],
["Blank (3)",["brings","reminds","insists","recalls"],1,"Cấu trúc “remind somebody of something” = khiến ai nhớ đến điều gì. Sau “can” dùng động từ nguyên mẫu “remind”.","Âm nhạc cũng có thể khiến chúng ta nhớ về những khoảng thời gian buồn."],
["Blank (4)",["But","When","Because","So"],1,"“When” mở đầu mệnh đề thời gian: khi bệnh nhân nghe nhạc...","Khi bệnh nhân nghe những bài hát họ từng yêu thích..."],
["Blank (5)",["directly","loudly","online","live"],3,"“Hear something live” nghĩa là nghe trực tiếp tại buổi biểu diễn.","Đặc biệt là những bài hát họ từng nghe trực tiếp hoặc tại buổi hòa nhạc."],
["Blank (6)",["memory","skill","habit","emotion"],0,"Cụm “lose their memory” nghĩa là mất trí nhớ.","Một số người tưởng như đã mất trí nhớ bắt đầu ngân nga và hát trở lại."],
["Blank (7)",["and","so","but","for"],2,"“But” thể hiện tương phản: không phải thuốc nhưng vẫn hiệu quả.","Nó không phải thuốc để nuốt, nhưng vẫn có thể hiệu quả."],
["Blank (8)",["fear","stress","energy","pain"],3,"Đoạn văn nói về việc âm nhạc giúp giảm đau, nên tập trung ít hơn vào “pain”.","Chúng ta ít tập trung vào cơn đau hơn."],
["Blank (9)",["create","listen to","perform","practise"],1,"Cấu trúc “listen to music/songs” = nghe nhạc/bài hát.","Chúng ta muốn nghe chúng hết lần này đến lần khác."],
["Blank (10)",["powerful","emotional","addictive","useful"],2,"“Become addictive” diễn tả điều gì đó có thể gây nghiện.","Âm nhạc có thể gây nghiện, nhưng là một trong những dạng nghiện lành mạnh nhất."]
]}
];

document.addEventListener("copy",e=>{if(e.target.closest(".typing"))e.preventDefault()});document.addEventListener("cut",e=>{if(e.target.closest(".typing"))e.preventDefault()});document.addEventListener("paste",e=>{if(e.target.closest(".typing"))e.preventDefault()});
let state={};let active=null;
const $=s=>document.querySelector(s);
$("#enter").onclick=()=>{if($("#pw").value.trim()==="367"){$("#login").classList.add("hidden");$("#app").classList.remove("hidden");renderNav();show(sections[0].id)}else $("#loginMsg").textContent="Mật khẩu chưa đúng. Vui lòng thử lại."};
$("#pw").addEventListener("keydown",e=>{if(e.key==="Enter")$("#enter").click()});
function renderNav(){let n=$("#nav");n.innerHTML="";sections.forEach(s=>{let b=document.createElement("button");b.textContent=s.title;b.dataset.id=s.id;b.onclick=()=>show(s.id);n.appendChild(b)})}
function show(id){active=id;document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("active",b.dataset.id===id));if(!state[id])state[id]={i:0,answers:{},score:0,hints:{}};render()}
function render(){const s=sections.find(x=>x.id===active),st=state[active];const stage=$("#stage");stage.innerHTML="";const sec=document.createElement("section");sec.className="section";sec.innerHTML=`<h2>${s.title}</h2><p>${s.intro}</p><div class="score" id="score"></div>`;let target=sec;
if(s.passage){const split=document.createElement("div");split.className="split";const read=document.createElement("div");read.className="reading";read.innerHTML="<h3>Reading</h3><div></div><div class='translation'><b>Bản dịch tiếng Việt</b><div></div></div>";read.children[1].textContent=s.passage;read.querySelector(".translation div").textContent=s.translation;const qp=document.createElement("div");qp.className="questionPane";qp.innerHTML="<h3>Questions</h3><div id='questionTarget'></div>";split.append(read,qp);sec.append(split);target=qp.querySelector("#questionTarget")}
if(s.type==="typing"){const pick=document.createElement("div");pick.style.margin="10px 0";pick.innerHTML="<label for='questionPick'><b>Go to sentence / Chọn câu:</b> </label>";const sel=document.createElement("select");sel.id="questionPick";sel.style.padding="10px";sel.style.borderRadius="8px";s.questions.forEach((item,k)=>{const op=document.createElement("option");op.value=k;op.textContent=`Sentence ${k+1}${Object.prototype.hasOwnProperty.call(st.answers,k)?" ✓":""}`;sel.append(op)});sel.value=st.i;sel.onchange=()=>{st.i=Number(sel.value);render()};pick.append(sel);sec.append(pick)}
const q=s.questions[st.i];sec.querySelector("#score").textContent=`Điểm: ${st.score} / ${Object.keys(st.answers).length} câu đã làm`;const box=document.createElement("div");box.className="qbox";box.innerHTML=`<span class="tag">Question ${st.i+1} / ${s.questions.length}</span><div class="qtext"></div>`;box.querySelector(".qtext").textContent=q[0];const answered=Object.prototype.hasOwnProperty.call(st.answers,st.i);
if(s.type==="typing"){const inp=document.createElement("textarea");inp.className="typing";inp.rows=3;inp.placeholder="Type the complete sentence here...";inp.autocomplete="off";inp.spellcheck=false;inp.disabled=answered;inp.value=answered?st.answers[st.i].value:"";inp.addEventListener("copy",e=>e.preventDefault());inp.addEventListener("cut",e=>e.preventDefault());inp.addEventListener("paste",e=>e.preventDefault());inp.addEventListener("contextmenu",e=>e.preventDefault());box.append(inp);const hint=document.createElement("div");hint.className="hint";hint.textContent=st.hints[st.i]?"Hint: "+q[2]:"Hint is hidden.";box.append(hint);const controls=document.createElement("div");controls.className="controls";const hb=document.createElement("button");hb.className="secondary";hb.textContent="HINT";hb.disabled=answered;hb.onclick=()=>{st.hints[st.i]=true;hint.textContent="Hint: "+q[2]};const check=document.createElement("button");check.textContent="Check answer";check.disabled=answered;check.onclick=()=>{let val=inp.value.trim();if(!val){alert("Please type an answer first.");return}const norm=x=>x.toLowerCase().replace(/[.,!?;:]/g,"").replace(/\s+/g," ").trim();const ok=norm(val)===norm(q[1]);st.answers[st.i]={value:val,correct:ok};if(ok)st.score++;render()};const resetOne=document.createElement("button");resetOne.className="danger";resetOne.textContent="Reset this sentence";resetOne.onclick=()=>{if(Object.prototype.hasOwnProperty.call(st.answers,st.i)){if(st.answers[st.i].correct)st.score--;delete st.answers[st.i]}delete st.hints[st.i];render()};controls.append(hb,check,resetOne);box.append(controls)}
else {const opts=document.createElement("div");opts.className="options";q[1].forEach((o,j)=>{const b=document.createElement("button");b.className="opt";b.textContent=String.fromCharCode(65+j)+". "+o;b.disabled=answered;b.onclick=()=>{if(Object.prototype.hasOwnProperty.call(st.answers,st.i))return;st.answers[st.i]=j;if(j===q[2])st.score++;render()};if(answered&&j===q[2])b.classList.add("correct");if(answered&&j===st.answers[st.i]&&j!==q[2])b.classList.add("wrong");opts.append(b)});box.append(opts)}
if(answered){const fb=document.createElement("div");const correct=s.type==="typing"?st.answers[st.i].correct:st.answers[st.i]===q[2];fb.className="feedback "+(correct?"good":"bad");let correctText=s.type==="typing"?q[1]:String.fromCharCode(65+q[2])+". "+q[1][q[2]];fb.innerHTML=`<p><b>${correct?"Correct! ✓":"Not quite. ✗"}</b> Đáp án đúng: <b></b></p><p><b>Giải thích:</b> </p><p><b>Nghĩa tiếng Việt cả câu:</b> </p>`;fb.querySelectorAll("p")[0].append(document.createTextNode(" "+correctText));fb.querySelectorAll("p")[1].append(document.createTextNode(" "+(s.type==="typing"?q[2]:q[3])));fb.querySelectorAll("p")[2].append(document.createTextNode(" "+(s.type==="typing"?q[3]:q[4]||"")));box.append(fb)}
target.append(box);
const ctr=document.createElement("div");ctr.className="controls";const left=document.createElement("div"),right=document.createElement("div");const prev=document.createElement("button");prev.className="secondary";prev.textContent="← Previous";prev.disabled=st.i===0;prev.onclick=()=>{st.i--;render()};const next=document.createElement("button");next.textContent="Next →";next.disabled=st.i===s.questions.length-1;next.onclick=()=>{st.i++;render()};left.append(prev,next);const reset=document.createElement("button");reset.className="danger";reset.textContent="Reset this section";reset.onclick=()=>{if(confirm("Xóa điểm và đáp án của riêng phần này?")){state[s.id]={i:0,answers:{},score:0,hints:{}};render()}};right.append(reset);ctr.append(left,right);sec.append(ctr);stage.append(sec)}
</script></body></html>
